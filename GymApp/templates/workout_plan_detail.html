{% extends 'base.html'  %}
{% block content  %}
<body class="bg-light">

<div class="container py-5">

    <a href="{% url 'my_workout_plans' %}"
       class="btn btn-outline-secondary mb-4">
        ← Back to My Workout Plans
    </a>


    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h1 class="fw-bold">
                {{ workout_plan.title }}
            </h1>

            <p class="text-muted">
                Created on
                {{ workout_plan.created_at|date:"F d, Y - h:i A" }}
            </p>

            <hr>


            <div style="white-space: pre-line;">

                {{ workout_plan.description }}

            </div>

        </div>

    </div>

</div>
{% endblock %}
