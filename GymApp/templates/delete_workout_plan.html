{% extends 'base.html' %} {% block title %}Delete Workout Plan{% endblock %} 
{% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm" style="border-radius: 18px">
        <div class="card-body p-4 text-center">
          <div
            class="d-flex align-items-center justify-content-center mx-auto mb-3"
            style="
              width: 65px;
              height: 65px;
              border-radius: 18px;
              background: rgba(220, 53, 69, 0.1);
            "
          >
            <i class="fa-solid fa-trash fa-2x text-danger"></i>
          </div>

          <h4 class="fw-bold">Delete Workout Plan?</h4>

          <p class="text-muted">
            Are you sure you want to delete

            <strong> "{{ workout_plan.title }}" </strong>

            ?

            <br />

            This action cannot be undone.
          </p>

          <form method="POST">
            {% csrf_token %}

            <div class="d-flex justify-content-center gap-2">
              <a
                href="{% url 'workout_plan_detail' workout_plan.id %}"
                class="btn btn-outline-secondary"
                style="border-radius: 12px"
              >
                Cancel
              </a>

              <button
                type="submit"
                class="btn btn-danger"
                style="border-radius: 12px"
              >
                <i class="fa-solid fa-trash me-1"></i>
                Yes, Delete
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
