{% extends 'base.html' %}

{% block content %}

<h2 class="mb-3">
    {% if mode == 'add' %} Add Member {% else %} Edit Member {% endif %}
</h2> 

<form method="post" class="row g-3 w-75">
    {% csrf_token %}

    {% if mode == 'add' %}
    <div class="col-md-6">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="name" name="username"required>
    </div>
    <div class="col-md-6">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
    </div>
    {% endif %}

   <div class="col-md-6">
    <label for="full_name" class="form-label">Full Name</label>
    <input type="text" class="form-control" id="full_name" name="full_name" value="{{ member.full_name|default:'' }}" required>
   </div>
   <div class="col-md-3">
    <label for="mobile" class="form-label">Mobile</label>
    <input type="number" class="form-control" id="mobile" name="mobile" value="{{ member.mobile|default:'' }}" maxlength="10" required>
   </div>
   <div class="col-md-3">
    <label for="age" class="form-label">Age</label>
    <input type="number" class="form-control" id="age" name="age" value="{{ member.age|default:'' }}" required>
   </div>
   <div class="col-md-3">
    <label for="gender" class="form-label">Gender</label>
    <select class="form-select" id="gender" name="gender">
        <option value="">Select Gender</option>
        <option value="Male" {% if member.gender == 'Male' %}selected{% endif %}>Male</option>
        <option value="Female" {% if member.gender == 'Female' %}selected{% endif %}>Female</option>
        <option value="Other" {% if member.gender == 'Other' %}selected{% endif %}>Other</option>
    </select>
   </div>

   <div class="col-md-3">
    <label for="join_date" class="form-label">Join Date</label>
    <input type="date" class="form-control" id="join_date" name="join_date" value="{{ member.join_date|date:'Y-m-d'}}" required>
   </div>

   <div class="col-md-6">
    <label for="address" class="form-label">Address</label>
    <textarea class="form-control" id="address" name="address" rows="2" required>{{ member.address|default:'' }}</textarea>
   </div>

   <div class="col-md-6">
    <label for="plan" class="form-label">Membership Plan</label>
    <select class="form-select" id="plan" name="plan_id">
        <option value="">Select Plan</option>
        {% for plan in plans %}
        <option value="{{ plan.id }}" {% if member.plan and member.plan.id == plan.id  %}selected{% endif %}>
            {{ plan.name }} ({{ plan.duration_months }} months) - रु{{ plan.fee }}
        </option>
        {% endfor %}
    </select>
   </div>

    <div class="col-md-6">
    <label class="form-label">Trainer</label>
    <select class="form-select" id="trainer" name="trainer_id">
        <option value="">No Trainer</option>
        {% for trainer in trainers %}
        <option value="{{ trainer.id }}" {% if member.trainer and member.trainer.id == trainer.id %}selected{% endif %}>
            {{ trainer.name }} - {{ trainer.specialization }}
        </option>
        {% endfor %}
    </select>
   </div>

    <div class="col-md-12">
        <button type="submit" class="btn btn-primary">
            {% if mode == 'add' %} Add Member {% else %} Update Member {% endif %}
        </button>
        <a href="{% url 'admin_members_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
